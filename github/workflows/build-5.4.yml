name: Build fgetpriority for android12-5.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:android12-5.4
    steps:
      - name: Checkout lkm branch
        uses: actions/checkout@v4
        with:
          ref: lkm

      - name: Compile LKM for 5.4
        run: |
          cd kernel
          make -C /home/ddk/kdir/android12-5.4 M=$PWD ARCH=arm64 LLVM=1 modules
          llvm-strip --strip-debug fgetpriority.ko

      - name: Package Magisk/KSU Module ZIP
        run: |
          mkdir -p out_zip/ko
          cp kernel/fgetpriority.ko out_zip/ko/android12-5.4_arm64_fgetpriority.ko
          cp customize.sh module.prop service.sh out_zip/
          cd out_zip
          zip -r ../fgetpriority_android12-5.4.zip *

      - name: Upload Ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority_android12-5.4_module
          path: fgetpriority_android12-5.4.zip

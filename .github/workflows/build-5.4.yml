name: Build fgetpriority APatch ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make clang lld llvm git zip curl build-essential libelf-dev

      - name: Clone Android Kernel 5.4
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common kernel_src

      - name: Prepare Kernel and Enable CONFIG_FGETPRIORITY
        run: |
          cd kernel_src
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # Включаем опции и отключаем проблемные host-утилиты
          ./scripts/config --enable CONFIG_FGETPRIORITY
          scripts/config --disable DEBUG_INFO
          scripts/config --disable GENDWARFKSYMS
          
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          echo "5.4.254-android12-9-g3610580b8b22-ab2213" > include/config/kernel.release
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" olddefconfig modules_prepare

      - name: Build fgetpriority.ko with debug & verbose output
        run: |
          # Добавляем V=1 для подробного лога компиляции и убираем жесткое падение на варнингах
          make -C $(pwd)/kernel_src M=$(pwd)/kernel ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" V=1 modules || true
          
          # Проверяем, появился ли файл, перед тем как копировать
          if [ -f kernel/fgetpriority.ko ]; then
            echo "Module built successfully!"
            mkdir -p module/ko
            cp kernel/fgetpriority.ko module/ko/fgetpriority.ko
          else
            echo "ERROR: fgetpriority.ko was not generated by make."
            exit 1
          fi

      - name: Package flashable ZIP for APatch
        run: |
          cd module
          zip -r9 ../fgetpriority-module.zip ./*

      - name: Upload Ready APatch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-apatch-zip
          path: fgetpriority-module.zip

- name: Prepare Kernel and Enable CONFIG_FGETPRIORITY
        run: |
          cd kernel_src
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          
          # Принудительно включаем наш модуль в конфигурацию ядра
          ./scripts/config --enable CONFIG_FGETPRIORITY
          
          scripts/config --disable DEBUG_INFO
          scripts/config --disable GENDWARFKSYMS
          
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          echo "5.4.254-android12-9-g3610580b8b22-ab2213" > include/config/kernel.release
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" olddefconfig modules_prepare

      - name: Build fgetpriority.ko and place into module/ko/
        run: |
          make -C $(pwd)/kernel_src M=$(pwd)/kernel ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" modules
          mkdir -p module/ko
          cp kernel/fgetpriority.ko module/ko/fgetpriority.ko

name: Build fgetpriority for android12-5.4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout lkm branch
        uses: actions/checkout@v4
        with:
          repository: aerath-stuff/fgetpriority
          ref: lkm

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev bc bison flex ccache llvm clang

      - name: Download Android 5.4 Kernel Source
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.4 kernel_src

      - name: Prepare Kernel Headers
        run: |
          cd kernel_src
          make ARCH=arm64 defconfig
          make ARCH=arm64 scripts prepare modules_prepare

      - name: Compile LKM for 5.4
        run: |
          cd kernel
          # Исправленный вызов make с явным указанием компиляторов
          make -C ../kernel_src M=$PWD ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip modules
          llvm-strip --strip-debug fgetpriority.ko
          cp fgetpriority.ko $GITHUB_WORKSPACE/

      - name: Package Magisk/KSU Module ZIP
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p out_zip/ko
          cp fgetpriority.ko out_zip/ko/android12-5.4_arm64_fgetpriority.ko
          cp customize.sh module.prop service.sh out_zip/ 2>/dev/null || true
          cd out_zip
          zip -r ../fgetpriority_android12-5.4.zip *

      - name: Upload Ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority_android12-5.4_module
          path: fgetpriority_android12-5.4.zip

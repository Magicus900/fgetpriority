name: Build fgetpriority APatch ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make clang lld llvm git zip

      - name: Clone Android 12 5.4 Kernel
        run: |
          git clone --depth=1 -b common-android12-5.4 https://android.googlesource.com/kernel/common kernel_src

      - name: Prepare Kernel for 5.4.254-android12-9-g3610580b8b22-ab2213
        run: |
          cd kernel_src
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config
          echo "5.4.254-android12-9-g3610580b8b22-ab2213" > include/config/kernel.release
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" modules_prepare

      - name: Build fgetpriority.ko and place into module/ko/
        run: |
          make -C $(pwd)/kernel_src M=$(pwd)/kernel ARCH=arm64 LLVM=1 LLVM_IAS=1 KERNELRELEASE="5.4.254-android12-9-g3610580b8b22-ab2213" modules
          mkdir -p module/ko
          cp kernel/fgetpriority.ko module/ko/fgetpriority.ko

      - name: Build userspace binary (if Makefile exists)
        run: |
          if [ -f userspace/Makefile ] || [ -f userspace/*.c ]; then
            cd userspace
            ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang -O2 *.c -o fgetpriority_ctl 2>/dev/null || true
            cd ..
          fi

      - name: Package flashable ZIP for APatch
        run: |
          cd module
          zip -r9 ../fgetpriority-module.zip ./*

      - name: Upload Ready APatch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fgetpriority-apatch-zip
          path: fgetpriority-module.zip
